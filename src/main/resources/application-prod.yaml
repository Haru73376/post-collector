server:
  # Railway terminates TLS at its edge proxy and forwards plain HTTP to the
  # container; without this, Spring doesn't know the original request was
  # HTTPS and generates http:// URLs (e.g. in the OpenAPI spec's server
  # entry), which browsers then refuse to call from an https:// page.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 900000      # 15 minutes
      refresh-token-expiration: 604800000  # 7 days

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
